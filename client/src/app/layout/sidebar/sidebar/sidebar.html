<aside class="sidebar">
  <div class="brand">
    <span class="brand-mark">L</span>
    <span class="brand-name">LENS</span>
  </div>

  <button class="new-chat-button" type="button">
    <span class="plus">+</span>
    <span>New chat</span>
  </button>

  <nav class="sidebar-nav" aria-label="Main navigation">
    <div class="nav-section">
      <div class="nav-label">Workspace</div>

      <a
        class="nav-item"
        routerLink="/ask"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="nav-icon">⌂</span>
        <span>Ask</span>
      </a>

      <a
        class="nav-item"
        routerLink="/sources"
        routerLinkActive="active"
      >
        <span class="nav-icon">◉</span>
        <span>Sources</span>
      </a>

      <a
        class="nav-item"
        routerLink="/knowledge"
        routerLinkActive="active"
      >
        <span class="nav-icon">◇</span>
        <span>Knowledge</span>
      </a>

      <a
        class="nav-item"
        routerLink="/review"
        routerLinkActive="active"
      >
        <span class="nav-icon">✓</span>
        <span>Review</span>
      </a>

      <a
        class="nav-item"
        routerLink="/compare"
        routerLinkActive="active"
      >
        <span class="nav-icon">↔</span>
        <span>Compare</span>
      </a>

      <a
        class="nav-item"
        routerLink="/life"
        routerLinkActive="active"
      >
        <span class="nav-icon">◒</span>
        <span>Life</span>
      </a>
    </div>

    <div class="nav-section recent-section">
      <div class="nav-label">Recent</div>

      @for (chat of recentChats; track chat) {
        <button class="recent-item" type="button">
          {{ chat }}
        </button>
      }
    </div>
  </nav>

  <div class="sidebar-footer">
    <button class="nav-item" type="button">
      <span class="nav-icon">⚙</span>
      <span>Settings</span>
    </button>
  </div>
</aside>
